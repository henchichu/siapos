# Development only: adds the demo shop and the known dev PINs to a fresh database.
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
name: siapos

services:
  mysql-db:
    environment:
      SIAPOS_DEV: "1"
    volumes:
      - ./sql/dev:/sql-dev:ro
  pos-app:
    environment:
      KIOSK_LOCATION_ID: loc-campus   # the demo café the customer iPad orders at
      KIOSK_PHONE_SIGNIN: "1"         # the demo customers are made up, so the public address may offer phone sign-in
