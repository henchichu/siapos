name: siapos

services:
  mysql-db:
    image: mysql:8.4.11         # the triggers and sql/tests were verified on this version
    container_name: posdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # host-only, for DB tools on this machine;
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: miniworld
      MYSQL_USER: app_user
      MYSQL_PASSWORD_FILE: /run/secrets/app_user_password
    command: --default-time-zone="+00:00"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init_scripts:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_root_password
      - app_user_password
      - kiosk_user_password
    healthcheck:
      # The marker comes from 99-ready.sh, so a restart after a failed init (which skips init) never reports healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 && test -f /var/lib/mysql/.siapos-ready"]
      interval: 5s
      retries: 20

  # The staff side: registers, kitchen, timecards, reports, Settings. Published to this machine only; reach it from elsewhere over a
  # private network (see README). Also runs the jobs that cancel unpaid kiosk orders and tell kitchen screens about new ones.
  pos-api:
    build: .
    restart: unless-stopped
    healthcheck:
      # the image has no curl: node's own fetch asks the /health route
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: miniworld
      DB_USER: app_user
      DB_PASSWORD_FILE: /run/secrets/app_user_password
      DB_POOL_SIZE: 15
      GIFTCARD_SECRET_FILE: /run/secrets/giftcard_secret
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # 1 once the app is served over HTTPS
      TRUST_PROXY: ${TRUST_PROXY:-0}       # 1 when a reverse proxy sits in front
      KIOSK_HOST: ${KIOSK_HOST:-localhost} # the public hostname (same default as caddy), so Settings shows each café's full order link
    volumes:
      - uploads:/app/uploads
    secrets:
      - app_user_password
      - giftcard_secret
    depends_on:
      mysql-db:
        condition: service_healthy

  # The public side: the order page phones open (/order/<café id>) and /api/customer/*, nothing of the staff side. Its own
  # database login (kiosk_user) that can only read the menu and write orders, its own small pool, and the pictures read-only.
  kiosk-api:
    build: .
    command: ["node", "server/kiosk.js"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "3001"            # reachable only by other containers (the caddy service below)
    environment:
      KIOSK_PORT: 3001
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: miniworld
      DB_USER: kiosk_user
      DB_PASSWORD_FILE: /run/secrets/kiosk_user_password
      DB_POOL_SIZE: 8
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      KIOSK_SHARED_DEVICE: ${KIOSK_SHARED_DEVICE:-} # 1 when the order screen is one shared iPad: it signs customers out quickly
      KIOSK_PHONE_SIGNIN: ${KIOSK_PHONE_SIGNIN:-}   # 1 lets customers sign in by phone on the public address: demos with made-up customers only
    volumes:
      - uploads:/app/uploads:ro
    secrets:
      - kiosk_user_password
    depends_on:
      mysql-db:
        condition: service_healthy

  # The only way in from the internet: Caddy takes HTTPS on 80 and 443 (it gets its certificate for KIOSK_HOST by itself)
  # and forwards to the kiosk side only. Off by default; on the server: docker compose --profile public up -d
  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KIOSK_HOST: ${KIOSK_HOST:-localhost}   # the public hostname; with localhost Caddy makes its own certificate
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      kiosk-api:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
  caddy_data:

secrets:
  db_root_password:
    file: ./sql/secrets/root_password.txt
  app_user_password:
    file: ./sql/secrets/app_user_password.txt
  giftcard_secret:
    file: ./sql/secrets/giftcard_secret.txt
  kiosk_user_password:
    file: ./sql/secrets/kiosk_user_password.txt
