name: siapos

services:
  mysql-db:
    image: mysql:8.4.11         # the triggers and sql/tests were verified on this version
    container_name: posdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # host-only, for DB tools on this machine;
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: miniworld
      MYSQL_USER: app_user
      MYSQL_PASSWORD_FILE: /run/secrets/app_user_password
    command: --default-time-zone="+00:00"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init_scripts:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_root_password
      - app_user_password
    healthcheck:
      # The marker comes from 99-ready.sh, so a restart after a failed init (which skips init) never reports healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 && test -f /var/lib/mysql/.siapos-ready"]
      interval: 5s
      retries: 20

  pos-app:
    build: .
    ports:
      - "3000:3000"       # the staff side: the tills and the owner (over an SSH tunnel when away)
    expose:
      - "3001"            # the public kiosk side, reachable only by other containers (the ngrok service below)
    environment:
      PORT: 3000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: miniworld
      DB_USER: app_user
      DB_PASSWORD_FILE: /run/secrets/app_user_password
      GIFTCARD_SECRET_FILE: /run/secrets/giftcard_secret
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # 1 once the app is served over HTTPS
      TRUST_PROXY: ${TRUST_PROXY:-0}       # 1 when a reverse proxy sits in front
      KIOSK_LOCATION_ID: ${KIOSK_LOCATION_ID:-}   # the café the customer iPad orders at; required with more than one café
    volumes:
      - uploads:/app/uploads
    secrets:
      - app_user_password
      - giftcard_secret
    depends_on:
      mysql-db:
        condition: service_healthy

  # The only way in from the internet: ngrok forwards to the kiosk side only. Off by default:
  #   put NGROK_AUTHTOKEN and NGROK_DOMAIN (your free static domain) in a .env file, then
  #   docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "pos-app:3001", "--url=${NGROK_DOMAIN:-}"]   # older ngrok versions call --url --domain
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - pos-app

volumes:
  mysql_data:
  uploads:

secrets:
  db_root_password:
    file: ./sql/secrets/root_password.txt
  app_user_password:
    file: ./sql/secrets/app_user_password.txt
  giftcard_secret:
    file: ./sql/secrets/giftcard_secret.txt
