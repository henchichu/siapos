name: siapos

services:
  mysql-db:
    image: mysql:8.4.11         # the triggers and sql/tests were verified on this version
    container_name: posdb
    restart: unless-stopped
    networks: [db]              # internal: no published port, reachable only by pos-api (docker-compose.test.yaml opens it for host tests)
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: miniworld
      MYSQL_USER: app_user
      MYSQL_PASSWORD_FILE: /run/secrets/app_user_password
    command: --default-time-zone="+00:00"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init_scripts:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_root_password
      - app_user_password
    healthcheck:
      # The marker comes from 99-ready.sh, so a restart after a failed init (which skips init) never reports healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 && test -f /var/lib/mysql/.siapos-ready"]
      interval: 5s
      retries: 20

  pos-api:
    build: .
    restart: unless-stopped
    networks: [db, web]         # db to reach MySQL, web for the published port
    healthcheck:
      # the image has no curl: node's own fetch asks the /health route
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: miniworld
      DB_USER: app_user
      DB_PASSWORD_FILE: /run/secrets/app_user_password
      DB_POOL_SIZE: 15
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # 1 once the app is served over HTTPS
      TRUST_PROXY: ${TRUST_PROXY:-0}       # 1 when a reverse proxy sits in front
    volumes:
      - uploads:/app/uploads
    secrets:
      - app_user_password
    depends_on:
      mysql-db:
        condition: service_healthy

networks:
  db:
    internal: true   # no route in or out of this network except through pos-api
  web: {}

volumes:
  mysql_data:
  uploads:

secrets:
  db_root_password:
    file: ./sql/secrets/root_password.txt
  app_user_password:
    file: ./sql/secrets/app_user_password.txt
